name: DM100 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install
        run: python -m pip install -c requirements/constraints.txt -e ".[ui,video,dev]"
      - name: Lint
        run: python -m ruff check --no-cache .
      - name: Formatting
        run: python -m ruff format --check --no-cache .
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Validate published evidence
        run: |
          python scripts/validate_evidence.py docs/results/validation-study-v1
          python -m scripts.validate_regression_evidence docs/results/regression-v1.1
          python -m scripts.check_source_binding docs/results/validation-study-v1/protocol.json docs/results/regression-v1.1/protocol.json docs/results/numerical-reference.json
          python -m scripts.verify_reproduction --evidence-dir docs/results/validation-study-v1 docs/results/reproduction
      - name: Prepare a fresh launcher environment
        if: runner.os == 'Windows'
        env:
          DM100_NO_PAUSE: "1"
        run: cmd /d /c "launch-dm100.bat --setup-only"
      - name: Check the installed launcher
        if: runner.os == 'Windows'
        env:
          DM100_NO_PAUSE: "1"
        run: cmd /d /c "launch-dm100.bat --help"
      - name: Package
        run: python -m pip wheel . --no-deps --wheel-dir dist
