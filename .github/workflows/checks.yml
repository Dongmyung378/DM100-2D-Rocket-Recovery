name: DM100 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install
        run: python -m pip install -c requirements/runtime-constraints.txt -e ".[ui,video,dev]"
      - name: Lint
        run: python -m ruff check --no-cache .
      - name: Formatting
        run: python -m ruff format --check --no-cache .
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider -W "error:Glyph .*missing from font:UserWarning"
      - name: Validate recorded results JSON
        run: |
          python -c "import json; d=json.load(open('docs/results/validation-487.json', encoding='utf-8')); assert d['overall']['total']==487 and d['overall']['passed']==487, d['overall']"
      - name: Prepare a fresh launcher environment
        if: runner.os == 'Windows'
        env:
          DM100_NO_PAUSE: "1"
        run: cmd /d /c "launch-dm100.bat --setup-only"
      - name: Check the installed launcher
        if: runner.os == 'Windows'
        env:
          DM100_NO_PAUSE: "1"
        run: cmd /d /c "launch-dm100.bat --help"
      - name: Package
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify bundled wheel assets
        run: python -m scripts.check_runtime_package dist
      - name: Check Linux launcher
        if: runner.os == 'Linux'
        run: |
          sh launch-dm100.sh --setup-only
          sh launch-dm100.sh --doctor
