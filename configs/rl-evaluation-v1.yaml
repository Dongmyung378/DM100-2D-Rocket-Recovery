schema_version: 1
id: residual-rl-robustness-v1
base_config: configs/pid-baseline-v1.yaml
base_config_sha256: 30689be20d8902747602cbe2c19282de02320153df6c218666386ce481e165f6
controller_sha256: 80d4cbedbc545457072dc08f308ee408fd25996e3df500520135ec0452818a8a
seed: 378

# Final-holdout states are not generated by the Day 36 pilot command.
# Stream IDs separate splits while keeping 378 as the single reproducibility seed.
splits:
  train: {stream_id: 0, episodes_per_group: 400}
  development: {stream_id: 1, episodes_per_group: 200}
  final_holdout: {stream_id: 2, episodes_per_group: 200}
pilot_cases_per_level: 12

# Signed horizontal offset is sampled uniformly in abs_x_m, then given either sign.
initial_ranges:
  easy:
    abs_x_m: [2.0, 10.0]
    z_m: [70.0, 105.0]
    vx_m_s: [-1.5, 1.5]
    vz_m_s: [-22.0, -15.0]
    theta_deg: [-3.0, 3.0]
    omega_deg_s: [-1.5, 1.5]
    mass_kg: [970.0, 1000.0]
  expanded:
    abs_x_m: [8.0, 18.0]
    z_m: [100.0, 130.0]
    vx_m_s: [-3.0, 3.0]
    vz_m_s: [-28.0, -21.0]
    theta_deg: [-7.0, 7.0]
    omega_deg_s: [-3.0, 3.0]
    mass_kg: [930.0, 970.0]
  hard:
    abs_x_m: [12.0, 26.0]
    z_m: [115.0, 155.0]
    vx_m_s: [-5.0, 5.0]
    vz_m_s: [-36.0, -25.0]
    theta_deg: [-12.0, 12.0]
    omega_deg_s: [-6.0, 6.0]
    mass_kg: [850.0, 960.0]

# Missing disturbance fields mean nominal physics and exact observations.
# Delay counts are 0.02-second simulator steps, not 0.1-second control updates.
gust_start_s: [2.0, 4.0]
gust_duration_s: 2.0
groups:
  nominal:
    evaluation_level: clean
    levels:
      - {name: clean, initial_range: easy, disturbances: {}}
  initial_ood:
    evaluation_level: hard
    levels:
      - {name: expanded, initial_range: expanded, disturbances: {}}
      - {name: hard, initial_range: hard, disturbances: {}}
  wind:
    evaluation_level: constant_30
    levels:
      - {name: constant_15, initial_range: easy, disturbances: {wind_m_s: 15.0}}
      - {name: constant_30, initial_range: easy, disturbances: {wind_m_s: 30.0}}
      - {name: gust_80, initial_range: easy, disturbances: {gust_m_s: 80.0}}
  model_mismatch:
    evaluation_level: light
    levels:
      - {name: light, initial_range: easy, disturbances: {thrust_scale: 0.9, inertia_scale: 1.1}}
      - {name: medium, initial_range: easy, disturbances: {thrust_scale: 0.85, inertia_scale: 1.2}}
      - {name: strong, initial_range: easy, disturbances: {thrust_scale: 0.7, inertia_scale: 1.4}}
  sensor_delay:
    evaluation_level: medium
    levels:
      - {name: light, initial_range: easy, disturbances: {sensor_noise_scale: 1.0, observation_delay_physics_steps: 2}}
      - {name: medium, initial_range: easy, disturbances: {sensor_noise_scale: 2.0, observation_delay_physics_steps: 5, action_delay_physics_steps: 2, engine_lag_s: 0.1}}
      - {name: strong, initial_range: easy, disturbances: {sensor_noise_scale: 3.0, observation_delay_physics_steps: 10, action_delay_physics_steps: 5, engine_lag_s: 0.2}}
  combined:
    evaluation_level: medium
    levels:
      - name: light
        initial_range: expanded
        disturbances: {wind_m_s: 15.0, thrust_scale: 0.95, sensor_noise_scale: 1.0, observation_delay_physics_steps: 2}
      - name: medium
        initial_range: expanded
        disturbances: {wind_m_s: 30.0, gust_m_s: 40.0, thrust_scale: 0.85, inertia_scale: 1.2, sensor_noise_scale: 2.0, observation_delay_physics_steps: 5, action_delay_physics_steps: 2, engine_lag_s: 0.1}
      - name: strong
        initial_range: hard
        disturbances: {wind_m_s: 40.0, gust_m_s: 80.0, thrust_scale: 0.75, inertia_scale: 1.4, sensor_noise_scale: 3.0, observation_delay_physics_steps: 10, action_delay_physics_steps: 5, engine_lag_s: 0.2}

selection:
  primary: safe_landing_success_by_group
  nominal_regression_allowed: false
  group_regression_allowed: false
  stress_comparison: paired_success_difference
  stress_ci: stratified_paired_bootstrap_95
  stress_group_weighting: equal_group_weight
  stress_ci_lower_bound_gt: 0.0
  fuel_priority: after_robustness_gate
  final_holdout_access: after_checkpoint_freeze_only
