[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "powered-landing-guidance"
version = "0.1.0"
description = "Planar 100 t rocket ascent, staging and first-stage recovery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "PyYAML",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
video = ["imageio-ffmpeg>=0.6,<1"]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
