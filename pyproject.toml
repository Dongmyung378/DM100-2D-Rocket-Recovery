[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "powered-landing-guidance"
version = "1.0.0"
description = "DM100: a local 2D rocket launch and first-stage recovery simulator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = ["rocket", "simulation", "2d", "pid", "guidance", "control"]
dependencies = [
    "numpy",
    "scipy",
    "PyYAML",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
video = ["imageio-ffmpeg>=0.6,<1"]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=7", "ruff", "httpx>=0.27,<1"]

[project.scripts]
dm100 = "powered_landing_guidance.local_app:main"

[project.urls]
Repository = "https://github.com/Dongmyung378/DM100-2D-Rocket-Recovery"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
powered_landing_guidance = ["ui/*.html"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
