<text x="48" y="64" font-size="36" fill="#002147" font-weight="750">RTLS Recovery Propellant Budget by Phase</text>
<text x="48" y="102" font-size="18.5" fill="#556473">Unpowered grid-fin glide conserves propellant before terminal 3→1 hoverslam (Calm + 487-case stats)</text>
