<text x="225" y="636" font-size="17" fill="#52B780" font-weight="700" text-anchor="middle">중앙 2,613 kg · 최소 932 kg</text>

<rect x="423" y="592" width="354" height="54" rx="4" fill="#001630" stroke="#1E4673"/>
<rect x="423" y="592" width="354" height="3" fill="#6FA4DC"/>
