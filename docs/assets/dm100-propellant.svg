<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">DM100 100톤 메탈록스 RTLS 귀환 추진제 예산 및 2단 700 km 궤도 여유</title>
<desc id="desc">단 분리 이후 귀환 단계별 주추진제와 RCS 소모량, 약 29.4 km 무동력 격자핀 활강 구간 및 487케이스 1단·2단 잔여 추진제 통계입니다.</desc>
<style>text{font-family:'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo','Segoe UI',sans-serif;font-variant-numeric:tabular-nums}.eyebrow{letter-spacing:1.6px;font-weight:700}.mono{font-family:Consolas,'Courier New',monospace}</style>
<rect width="1200" height="670" fill="#002147"/>
<rect width="1200" height="6" fill="#C8A452"/>
<text x="48" y="46" font-size="13" fill="#DEC074" class="eyebrow">PROPELLANT BUDGET · LCH₄/LOX 7-ENGINE CLUSTER</text>
<text x="48" y="88" font-size="34" fill="#F5F3EE" font-weight="700">RTLS 귀환 단계별 추진제 예산</text>
<text x="48" y="118" font-size="18" fill="#9CB4CE">초음속·아음속 무동력 격자핀 활강으로 연료를 절약하고 종말 3→1 호버슬램으로 착륙합니다 (무풍 기준 + 487케이스)</text>

<rect x="48" y="142" width="1104" height="432" rx="4" fill="#082C56" stroke="#1E4673"/>
<text x="70" y="178" font-size="18" fill="#DEC074" font-weight="700">분리 이후 귀환 단계별 주추진제 소모 <tspan fill="#9CB4CE" font-weight="400">(1단 총 69,500 kg 중 상승 57,167 kg 제외 · 재점화 3/3회)</tspan></text>
