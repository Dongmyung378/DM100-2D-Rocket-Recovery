e-width="0.8"/><rect x="376" y="467" width="81.9" height="20" rx="2" fill="#52B780"/><text x="836" y="482" font-size="15" fill="#9CB4CE">주추진제 1,085.9 kg · RCS 1.8 kg (28.4 s)</text><text x="70" y="534" font-size="17" fill="#F5F3EE" font-weight="600">5초 직립 안정 (Standing)</text><rect x="376" y="519" width="444" height="20" rx="2" fill="#001630" stroke="#163B66" stroke-width="0.8"/><rect x="376" y="519" width="4.0" height="20" rx="2" fill="#3E8E63"/><text x="836" y="534" font-size="15" fill="#9CB4CE">주추진제 0.9 kg · RCS 0.0 kg (5.0 s)</text>

