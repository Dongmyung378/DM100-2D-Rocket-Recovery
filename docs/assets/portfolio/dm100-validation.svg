<text x="48" y="64" fill="#EDF4F4" font-size="36" font-weight="750" text-anchor="start">평가 집단별 기준 충족 결과</text>
<text x="48" y="104" fill="#B2C4CC" font-size="22" font-weight="400" text-anchor="start">같은 100%라도 집단의 조건과 분모가 다릅니다. 서로 합쳐 하나의 최종 성공률로 표시하지 않습니다.</text>
