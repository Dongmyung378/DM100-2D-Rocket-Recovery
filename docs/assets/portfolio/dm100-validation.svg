<title id="title">목적이 다른 세 평가 집단의 통과 결과</title>
<desc id="desc">기존 조건 회귀 검증 286개, 새로운 복합 조건 96개와 센서 확장 조건 48개는 서로 다른 집단입니다. 모든 실행이 선언한 합성 모델의 기준을 통과했습니다.</desc>
