<text x="48" y="104" fill="#B2C4CC" font-size="22" font-weight="400" text-anchor="start">무풍 조건의 시뮬레이션 기록을 시각화했습니다. 실제 비행 계측이나 새 센서 평가 통계가 아닙니다.</text>
