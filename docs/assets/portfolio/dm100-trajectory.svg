<title id="title">저장된 대표 비행의 궤적</title>
<desc id="desc">보존된 무풍 대표 비행의 수평 거리와 고도입니다. 새 센서 조건 평가의 통계가 아니며 실제 로켓 궤적을 측정한 것이 아닙니다.</desc>
